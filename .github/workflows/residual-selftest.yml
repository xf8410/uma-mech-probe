# 仓 A 轻量 CI：残差实验链路可跑性（上游 umaai-rs 源码零改动，不跑上游重 CI）
name: 残差实验链路自检（样例对齐+训练+报告）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖（numpy/sklearn/joblib）
        run: pip install numpy scikit-learn joblib

      - name: 样例对齐（有偏差是预期，退出码 2 放行）
        run: |
          python3 residual/compare.py --sim residual/sample/sim_turn12.json \
            --real residual/sample/real_turn12.json -o residual/sample/residual_turn12.json \
            || [ $? -eq 2 ]

      - name: 训练+盲区报告
        run: |
          python3 residual/train.py --data residual/sample \
            --model residual/sample/model.joblib --report residual/sample/blindspots.md
          test -s residual/sample/blindspots.md

      - name: 上游 umasim 源码未被改动的断言
        run: |
          test -f crates/umasim/Cargo.toml
          test -d residual
